<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Memories In Motion Transportation Ministry (MIM) logo">
  <defs>
    <clipPath id="mim-badge"><circle cx="120" cy="120" r="104"/></clipPath>
    <linearGradient id="mim-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDECC8"/>
      <stop offset="0.58" stop-color="#F7C278"/>
      <stop offset="1" stop-color="#EB9448"/>
    </linearGradient>
    <radialGradient id="mim-sun" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset="0.65" stop-color="#FFC44D"/>
      <stop offset="1" stop-color="#F1952E"/>
    </radialGradient>
    <!-- Royal Blue & Burgundy Hills (No Green) -->
    <linearGradient id="mim-ground-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3F73"/>
      <stop offset="1" stop-color="#12274A"/>
    </linearGradient>
    <linearGradient id="mim-ground-burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B1E34"/>
      <stop offset="1" stop-color="#4F1020"/>
    </linearGradient>
    <linearGradient id="mim-stone-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8F0"/>
    </linearGradient>
    <path id="mim-stone" d="M-4.2 6 V-2.2 A4.2 4.2 0 0 1 4.2 -2.2 V6 Z"/>
  </defs>

  <!-- Outer Honor Ring -->
  <circle cx="120" cy="120" r="118" fill="#14284B"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#C9973F" stroke-width="2.8"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#7B1E34" stroke-width="1.6"/>

  <g clip-path="url(#mim-badge)">
    <!-- Sunrise Sky -->
    <rect x="0" y="0" width="240" height="154" fill="url(#mim-sky)"/>

    <!-- Sun Rays -->
    <g stroke="#FFF6DC" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="120" y1="90" x2="120" y2="30"/>
      <line x1="98" y1="96" x2="74" y2="42"/>
      <line x1="142" y1="96" x2="166" y2="42"/>
      <line x1="82" y1="110" x2="42" y2="70"/>
      <line x1="158" y1="110" x2="198" y2="70"/>
      <line x1="72" y1="128" x2="26" y2="108"/>
      <line x1="168" y1="128" x2="214" y2="108"/>
    </g>

    <!-- Golden Rising Sun -->
    <circle cx="120" cy="144" r="42" fill="url(#mim-sun)"/>

    <!-- American Flag on Right -->
    <g transform="translate(168 54)">
      <rect x="-2" y="0" width="3" height="90" fill="#4B3828"/>
      <circle cx="-0.5" cy="-1.5" r="2.8" fill="#C9973F"/>
      <g>
        <path d="M1 2 C12 -2 22 6 36 2 V26 C22 30 12 22 1 26 Z" fill="#FFFFFF"/>
        <path d="M1 2 C12 -2 22 6 36 2 V5.5 C22 9.5 12 1.5 1 5.5 Z" fill="#B22234"/>
        <path d="M1 9.5 C12 5.5 22 13.5 36 9.5 V13 C22 17 12 9 1 13 Z" fill="#B22234"/>
        <path d="M1 17 C12 13 22 21 36 17 V20.5 C22 24.5 12 16.5 1 20.5 Z" fill="#B22234"/>
        <path d="M1 24.5 C12 20.5 22 28.5 36 24.5 V26 C22 30 12 22 1 26 Z" fill="#B22234"/>
        <path d="M1 2 C6 0.5 11 0.6 16 2 V14 C11 12.6 6 12.5 1 14 Z" fill="#14284B"/>
        <g fill="#FFFFFF">
          <circle cx="4.5" cy="5" r="0.9"/><circle cx="8.5" cy="4.6" r="0.9"/><circle cx="12.5" cy="5" r="0.9"/>
          <circle cx="6.5" cy="8" r="0.9"/><circle cx="10.5" cy="7.8" r="0.9"/>
          <circle cx="4.5" cy="11" r="0.9"/><circle cx="8.5" cy="10.6" r="0.9"/><circle cx="12.5" cy="11" r="0.9"/>
        </g>
      </g>
    </g>

    <!-- Prominent Memorial Headstone / Funeral Marker on Left Horizon -->
    <g transform="translate(52 118)">
      <!-- Headstone Base -->
      <rect x="-15" y="23" width="30" height="5" rx="1.2" fill="#D5DCE6" stroke="#14284B" stroke-width="1"/>
      <!-- Arched Funeral Headstone Tablet -->
      <path d="M-12 23 V7 A12 12 0 0 1 12 7 V23 Z" fill="url(#mim-stone-grad)" stroke="#14284B" stroke-width="1.2"/>
      <path d="M-9.5 21 V7.5 A9.5 9.5 0 0 1 9.5 7.5 V21 Z" fill="none" stroke="#7B1E34" stroke-width="0.7" opacity="0.65"/>
      <!-- Cross Emblem on Marker -->
      <path d="M0 1.5 V11 M-3.2 4.8 H3.2" stroke="#7B1E34" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Engraved Lines -->
      <line x1="-6" y1="14.5" x2="6" y2="14.5" stroke="#14284B" stroke-width="1" stroke-linecap="round"/>
      <line x1="-4.5" y1="17.5" x2="4.5" y2="17.5" stroke="#14284B" stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- Blue & Burgundy Rolling Hills (Replacing all green) -->
    <path d="M0 148 C44 136 84 142 120 145 C160 148 200 136 240 144 V240 H0 Z" fill="url(#mim-ground-blue)"/>
    <path d="M0 162 C52 150 96 164 138 158 C178 152 208 148 240 155 V240 H0 Z" fill="url(#mim-ground-burgundy)" opacity="0.88"/>

    <!-- Background Row of Veteran Cemetery Markers -->
    <g fill="#FFFFFF" stroke="#14284B" stroke-width="0.6">
      <use href="#mim-stone" x="26" y="150"/>
      <use href="#mim-stone" x="76" y="146"/>
      <use href="#mim-stone" x="186" y="145"/>
      <use href="#mim-stone" x="200" y="146"/>
      <use href="#mim-stone" x="214" y="148"/>
      <use href="#mim-stone" x="194" y="157"/>
      <use href="#mim-stone" x="208" y="158"/>
    </g>

    <!-- Winding Road Forming a Heart -->
    <path id="mim-road" d="M120 236 C112 214 68 206 56 185 C44 164 62 148 82 150 C100 152 114 165 120 177 C126 165 140 152 158 150 C178 148 196 164 184 185 C172 206 128 214 120 236"
          fill="none" stroke="#14284B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 236 C112 214 68 206 56 185 C44 164 62 148 82 150 C100 152 114 165 120 177 C126 165 140 152 158 150 C178 148 196 164 184 185 C172 206 128 214 120 236"
          fill="none" stroke="#F5C451" stroke-width="1.7" stroke-dasharray="5 4" stroke-linecap="round"/>

    <!-- Transportation Van on the Heart Road -->
    <g transform="translate(58 156) rotate(-36)">
      <path d="M-13 -4 H5 C8 -4 10 -2 12 1 L14 3 V7 H-13 Z" fill="#FFFFFF" stroke="#14284B" stroke-width="1"/>
      <rect x="-11" y="-2" width="5" height="3.4" rx="0.6" fill="#14284B"/>
      <rect x="-4.5" y="-2" width="5" height="3.4" rx="0.6" fill="#14284B"/>
      <path d="M2 -2 H5.5 C7 -2 8.4 -0.6 9.4 1.4 H2 Z" fill="#14284B"/>
      <rect x="-13" y="3.2" width="27" height="1.3" fill="#7B1E34"/>
      <circle cx="-7.5" cy="7.5" r="2.4" fill="#14284B"/>
      <circle cx="8" cy="7.5" r="2.4" fill="#14284B"/>
    </g>

    <!-- Prominent "MIM" Across the Middle of the Logo -->
    <g transform="translate(120 112)">
      <!-- Subtle Ribbon Pill Backdrop for High Contrast -->
      <rect x="-48" y="-20" width="96" height="34" rx="17" fill="#14284B" fill-opacity="0.88" stroke="#C9973F" stroke-width="1.8"/>
      <text x="0" y="4"
            text-anchor="middle"
            font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
            font-size="25"
            font-weight="700"
            letter-spacing="4"
            fill="#FFF7E2"
            stroke="#14284B"
            stroke-width="0.4">MIM</text>
    </g>
  </g>
</svg>
